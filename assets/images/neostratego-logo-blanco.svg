<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Logo sobre fondo blanco -->
  <defs>
    <linearGradient id="cyan-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="420" height="100" fill="#FFFFFF"/>

  <!-- Isotipo N oscuro -->
  <g transform="translate(16, 14)">
    <line x1="6"  y1="4"  x2="6"  y2="68" stroke="#0A1A2F" stroke-width="7" stroke-linecap="round"/>
    <line x1="6"  y1="4"  x2="50" y2="68" stroke="#0A1A2F" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="4"  x2="50" y2="68" stroke="#0A1A2F" stroke-width="7" stroke-linecap="round"/>
    <circle cx="36" cy="28" r="6" fill="#8A2BE2"/>
    <circle cx="36" cy="28" r="3" fill="#B060FF" opacity="0.7"/>
  </g>

  <line x1="88" y1="22" x2="88" y2="78" stroke="rgba(0,20,50,0.15)" stroke-width="1"/>

  <text x="102" y="52"
    font-family="Oswald, Impact, sans-serif"
    font-size="28" font-weight="600" letter-spacing="4"
    fill="#0A1A2F">NEO</text>
  <text x="171" y="52"
    font-family="Oswald, Impact, sans-serif"
    font-size="28" font-weight="300" letter-spacing="3"
    fill="#1A2A4F">STRATEGO</text>

  <text x="102" y="70"
    font-family="Inter, Arial, sans-serif"
    font-size="9" letter-spacing="3.5"
    fill="#8A2BE2" opacity="0.7">ESTRATEGIA · DATOS · IMPACTO</text>
</svg>
