<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#A0F7F7"/>
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="100" rx="8" fill="#0A1A2F"/>

  <!-- Isotipo: N mark -->
  <g transform="translate(16, 14)" filter="url(#glow)">
    <!-- Pilares N -->
    <line x1="6"  y1="4"  x2="6"  y2="68" stroke="url(#cyan-grad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="6"  y1="4"  x2="50" y2="68" stroke="url(#cyan-grad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="4"  x2="50" y2="68" stroke="url(#cyan-grad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Punto púrpura (acento de marca) -->
    <circle cx="36" cy="28" r="6" fill="#8A2BE2" opacity="0.95"/>
    <circle cx="36" cy="28" r="3" fill="#A060FF" opacity="0.7"/>
  </g>

  <!-- Separador vertical -->
  <line x1="88" y1="22" x2="88" y2="78" stroke="rgba(0,201,255,0.3)" stroke-width="1"/>

  <!-- Wordmark: NEOSTRATEGO -->
  <text
    x="102" y="52"
    font-family="Oswald, Impact, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="4"
    fill="url(#cyan-grad)"
    filter="url(#glow)"
  >NEO</text>
  <text
    x="171" y="52"
    font-family="Oswald, Impact, sans-serif"
    font-size="28"
    font-weight="300"
    letter-spacing="3"
    fill="#FFFFFF"
    opacity="0.92"
  >STRATEGO</text>

  <!-- Tagline -->
  <text
    x="102" y="70"
    font-family="Inter, Space Grotesk, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="3.5"
    fill="#00C9FF"
    opacity="0.6"
  >ESTRATEGIA · DATOS · IMPACTO</text>
</svg>
