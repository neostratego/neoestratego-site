<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Planeta Tierra con America Latina resaltada">
  <defs>
    <radialGradient id="ocean" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#0e3a63"/>
      <stop offset="55%" stop-color="#0a2747"/>
      <stop offset="100%" stop-color="#06152a"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="rgba(0,201,255,0)"/>
      <stop offset="93%" stop-color="rgba(0,201,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,201,255,0)"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15324a"/>
      <stop offset="100%" stop-color="#0c2236"/>
    </linearGradient>
    <linearGradient id="latam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="300" cy="300" r="240"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="270" fill="url(#atmo)"/>
  <circle cx="300" cy="300" r="240" fill="url(#ocean)"/>

  <g clip-path="url(#globe)">
    <g stroke="#1c4a6e" opacity="0.16" fill="none" stroke-width="1">
      <ellipse cx="300" cy="300" rx="240" ry="80"/>
      <ellipse cx="300" cy="300" rx="240" ry="150"/>
      <ellipse cx="300" cy="300" rx="240" ry="220"/>
      <ellipse cx="300" cy="300" rx="80" ry="240"/>
      <ellipse cx="300" cy="300" rx="150" ry="240"/>
      <ellipse cx="300" cy="300" rx="220" ry="240"/>
    </g>

    <path fill="url(#land)" opacity="0.7" d="M150 150 q40 -18 78 -6 q26 8 40 -2 q22 -14 44 -6 q18 8 10 28 q-10 24 -34 30 q-20 6 -30 22 q-12 20 -34 20 q-24 0 -40 -18 q-18 -22 -28 -44 q-10 -24 -6 -36 q4 -12 0 -32 z"/>

    <g filter="url(#glow)">
      <path fill="url(#latam)" d="M214 248 q30 -8 52 8 q20 14 38 14 q14 0 22 10 q6 10 -6 16 q-16 8 -30 4 q-18 -6 -32 4 q-14 10 -28 4 q-18 -8 -28 -26 q-10 -18 -10 -34 q0 -10 22 -20 z"/>
      <path fill="url(#latam)" d="M300 318 q34 -10 52 10 q16 18 14 42 q-2 26 -16 50 q-12 22 -14 46 q-2 28 -18 50 q-14 20 -34 18 q-20 -2 -26 -24 q-6 -22 -2 -46 q4 -28 -6 -52 q-10 -24 -6 -50 q4 -24 24 -34 q20 -10 38 -6 z"/>
    </g>

    <path d="M300 60 a240 240 0 0 1 0 480 a150 240 0 0 0 0 -480 z" fill="#06152a" opacity="0.45"/>
  </g>

  <circle cx="300" cy="300" r="240" fill="none" stroke="rgba(0,201,255,0.5)" stroke-width="1.5"/>
  <circle cx="320" cy="430" r="5" fill="#00C9FF"/>
  <circle cx="320" cy="430" r="11" fill="none" stroke="#00C9FF" stroke-width="1" opacity="0.6"/>
</svg>
